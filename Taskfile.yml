# SummonStack task runner — https://taskfile.dev
#
#   task              list every task
#   task up           start the stack
#   task doctor       check for the problems that actually bite this stack
#
# Install Task: https://taskfile.dev/installation/
version: "3"

vars:
  # Falls back to the compose default, which is what MySQL was initialised
  # with when no .env existed.
  DB_PASS:
    sh: |
      pw=$(grep -E '^DOCKER_DB_ROOT_PASSWORD=' .env 2>/dev/null | cut -d= -f2- || true)
      echo "${pw:-password}"
  ACORE_DBS: acore_auth acore_world acore_characters
  SS: python3 -m scripts.summonstack

includes:
  admin:
    taskfile: ./tasks/admin.yml
    dir: .
  db:
    taskfile: ./tasks/db.yml
    dir: .
  shop:
    taskfile: ./tasks/shop.yml
    dir: .
  client:
    taskfile: ./tasks/client.yml
    dir: .
  zerotier:
    taskfile: ./tasks/zerotier.yml
    dir: .
  cloudflare:
    taskfile: ./tasks/cloudflare.yml
    dir: .
  realm:
    taskfile: ./tasks/realm.yml
    dir: .

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ── Core Lifecycle ────────────────────────────────────────────────────────
  fix-perms:
    desc: Make the bind-mounted config dirs writable by the container user (uid 1000)
    silent: true
    cmds:
      - "{{.SS}} fix-perms"

  up:
    desc: Start the whole stack (playerbots realm too when PLAYERBOTS_MODE=1)
    cmds:
      - task: fix-perms
      # Renders docker-compose.override.yml from realms.yml before compose
      # reads it, so the services it starts are the realms the manifest
      # declares. The full reconcile runs afterwards, once MySQL is up.
      - task: realm:render
      - |
        profiles=""
        zt_id=$(grep -E '^ZEROTIER_NETWORK_ID=' .env 2>/dev/null | cut -d= -f2- || true)
        cf_token=$(grep -E '^CLOUDFLARE_TUNNEL_TOKEN=' .env 2>/dev/null | cut -d= -f2- || true)
        pb_mode=$(grep -E '^PLAYERBOTS_MODE=' .env 2>/dev/null | cut -d= -f2- || true)
        if [ -n "$zt_id" ]; then
          profiles="$profiles --profile zerotier"
        fi
        if [ -n "$cf_token" ]; then
          profiles="$profiles --profile cloudflare"
        fi
        if [ -n "$pb_mode" ] && [ "$pb_mode" != "0" ]; then
          profiles="$profiles --profile playerbots"
        fi
        docker compose $profiles up -d
      # Brings databases, realmlist and realm containers into line with
      # realms.yml. Waits for MySQL first: a first boot initialises its data
      # directory for ten minutes or more before it accepts a connection.
      - task: realm:apply
        vars: {WAIT: "900"}
      - task: ps

  dev:
    desc: Start the stack with the portal in hot-reload mode (development only)
    cmds:
      - task: fix-perms
      - task: realm:render
      # The generated realm override is only auto-loaded when no -f flags are
      # given, so it is listed explicitly here alongside the dev overlay.
      - |
        files="-f docker-compose.yml"
        [ -f docker-compose.override.yml ] && files="$files -f docker-compose.override.yml"
        files="$files -f docker-compose.dev.yml"
        docker compose $files up -d
      - task: realm:apply
        vars: {WAIT: "900"}
      - task: ps

  down:
    desc: Stop the stack (keeps all data)
    cmds:
      - docker compose down

  restart:
    desc: "Restart services, e.g. task restart -- ac-webapp"
    cmds:
      - docker compose restart {{.CLI_ARGS}}

  stop:
    desc: "Stop services gracefully, e.g. task stop -- ac-pb-realm-2"
    cmds:
      - docker compose stop {{.CLI_ARGS}}

  restart-db:
    desc: Restart the database server
    cmds:
      - docker compose restart ac-database

  restart-auth:
    desc: Restart the auth server
    cmds:
      - docker compose restart ac-authserver

  ps:
    desc: Show container status
    cmds:
      - docker compose ps -a

  logs:
    desc: "Follow logs from all running containers (or specific service, e.g. task logs -- ac-worldserver)"
    cmds:
      - bash -c 'trap "exit 0" INT; docker compose --profile "*" logs -f --tail 100 {{.CLI_ARGS}}'

  pull:
    desc: Refresh all images (guards against stale cached :master tags)
    cmds:
      - docker compose pull

  build:
    desc: Rebuild the webapp image and restart it
    cmds:
      - BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose build ac-webapp
      - docker compose up -d --no-deps ac-webapp

  world:
    desc: Attach to the worldserver console (detach with Ctrl-P Ctrl-Q)
    cmds:
      - task: realm:world
        vars: {REALM: "1"}

  # ── Account & Admin Aliases ──────────────────────────────────────────────
  admin:
    desc: "Create/promote a GM3 admin (wires the console on first setup; SOAP=1 repoints it)"
    requires:
      vars: [USER, PASS]
    cmds:
      - task: admin:default
        vars: {USER: "{{.USER}}", PASS: "{{.PASS}}", SOAP: "{{.SOAP}}"}

  soap:
    desc: "Point the admin console at an account: task soap USER=myadmin PASS=pw"
    requires:
      vars: [USER, PASS]
    cmds:
      - task: admin:soap
        vars: {USER: "{{.USER}}", PASS: "{{.PASS}}"}

  soap:check:
    desc: Verify the admin console credentials against the worldserver
    cmds:
      - task: admin:soap:check

  # ── Diagnostics & Setup ──────────────────────────────────────────────────
  doctor:
    desc: Check for stale images, missing .env, and container name clashes
    silent: true
    cmds:
      - "{{.SS}} doctor"

  setup:
    desc: Create .env with a random session secret (safe to re-run)
    status:
      - test -f .env
    cmds:
      - "{{.SS}} setup"

  # ── Reset ────────────────────────────────────────────────────────────────
  reset:
    desc: "Rebuild every game database from scratch (keeps the 3 GB client data)"
    prompt: Drop the shared databases AND every per-realm database in realms.yml, then re-import? All accounts and characters are lost.
    cmds:
      - |
        # Everything but the database itself, so no worldserver holds a
        # connection to a schema that is about to disappear. Taken from compose
        # rather than a fixed list, so realms added since still get stopped.
        services=$(docker compose --profile "*" config --services | grep -v '^ac-database$')
        docker compose stop $services
      - |
        # The shared three plus whatever the realms declare — a per-realm
        # character database left behind here would outlive the accounts it
        # refers to, since realmlist lives in acore_auth.
        for db in {{.ACORE_DBS}} $(task realm:databases); do
          echo "Dropping $db…"
          docker compose exec -T ac-database \
            mysql -uroot -p{{.DB_PASS}} -e "DROP DATABASE IF EXISTS \`$db\`;"
        done
      - task: db:import
      - task: up
      - |
        echo ""
        echo "Databases rebuilt. Recreate your admin account with:"
        echo "  task admin USER=myadmin PASS=MySecretPass1"

  reset:hard:
    desc: "Delete EVERYTHING including the DB and the 3 GB client data"
    prompt: Remove all containers AND volumes? The client data must then be re-downloaded (~3 GB).
    cmds:
      - docker compose down -v --remove-orphans
      - |
        echo ""
        echo "All volumes removed. Next: task up"
        echo "First boot re-downloads client data and re-initialises MySQL,"
        echo "which takes roughly 10-15 minutes before the portal responds."
