# SummonStack task runner — https://taskfile.dev
#
#   task              list every task
#   task up           start the stack
#   task doctor       check for the problems that actually bite this stack
#
# Install Task: https://taskfile.dev/installation/
version: "3"

vars:
  # Falls back to the compose default, which is what MySQL was initialised
  # with when no .env existed.
  DB_PASS:
    sh: |
      pw=$(grep -E '^DOCKER_DB_ROOT_PASSWORD=' .env 2>/dev/null | cut -d= -f2- || true)
      echo "${pw:-password}"
  ACORE_DBS: acore_auth acore_world acore_characters

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ── Lifecycle ────────────────────────────────────────────────────────────
  up:
    desc: Start the whole stack
    cmds:
      - docker compose up -d
      - task: ps

  down:
    desc: Stop the stack (keeps all data)
    cmds:
      - docker compose down

  restart:
    desc: "Restart services, e.g. task restart -- ac-webapp"
    cmds:
      - docker compose restart {{.CLI_ARGS}}

  ps:
    desc: Show container status
    cmds:
      - docker compose ps -a

  logs:
    desc: "Follow logs, e.g. task logs -- ac-worldserver"
    cmds:
      - docker compose logs -f --tail 100 {{.CLI_ARGS}}

  pull:
    desc: Refresh all images (guards against stale cached :master tags)
    cmds:
      - docker compose pull

  build:
    desc: Rebuild the webapp image and restart it
    cmds:
      - docker compose build ac-webapp
      - docker compose up -d --no-deps ac-webapp

  # ── Accounts ─────────────────────────────────────────────────────────────
  admin:
    desc: "Create/promote a GM3 admin (wires the console on first setup; SOAP=1 repoints it)"
    requires:
      vars: [USER, PASS]
    silent: true
    cmds:
      - docker compose exec ac-webapp node scripts/create-admin.mjs {{.USER}} {{.PASS}}
      - |
        # Wire the admin console automatically the first time, since a fresh
        # install always wants it. SOAP=1 is only needed to repoint a console
        # that is already configured, so creating a second admin cannot
        # silently steal the console from the first.
        cur_user=$(grep -E '^SOAP_USER=' .env 2>/dev/null | cut -d= -f2- || true)
        cur_pass=$(grep -E '^SOAP_PASS=' .env 2>/dev/null | cut -d= -f2- || true)
        if [ ! -f .env ]; then
          echo ""
          echo "No .env yet, so the admin console was not wired. Run:"
          echo "  task setup && task soap USER={{.USER}} PASS=<the password>"
        elif [ -n "{{.SOAP}}" ] || [ -z "$cur_pass" ]; then
          echo ""
          task soap USER='{{.USER}}' PASS='{{.PASS}}'
        else
          echo ""
          echo "Admin console is already wired to '${cur_user}' — left alone."
          echo "To repoint it at {{.USER}}, re-run with SOAP=1."
        fi

  soap:
    desc: "Point the admin console at an account: task soap USER=myadmin PASS=pw"
    requires:
      vars: [USER, PASS]
    silent: true
    cmds:
      - |
        test -f .env || { echo "No .env found. Run: task setup" >&2; exit 1; }
        # Values go through the environment rather than sed/awk -v so that
        # passwords containing &, |, \ or / cannot corrupt the file.
        set_env() {
          SS_KEY="$1" SS_VAL="$2" awk '
            BEGIN { k = ENVIRON["SS_KEY"]; v = ENVIRON["SS_VAL"]; done = 0 }
            index($0, k "=") == 1 { print k "=" v; done = 1; next }
            { print }
            END { if (!done) print k "=" v }
          ' .env > .env.tmp && mv .env.tmp .env
        }
        set_env SOAP_USER '{{.USER}}'
        set_env SOAP_PASS '{{.PASS}}'
        chmod 600 .env
        echo "Wrote SOAP_USER/SOAP_PASS to .env (mode 600)."
      - docker compose up -d --no-deps ac-webapp
      - task: soap:check

  soap:check:
    desc: Verify the admin console credentials against the worldserver
    silent: true
    cmds:
      - |
        user=$(grep -E '^SOAP_USER=' .env 2>/dev/null | cut -d= -f2- || true)
        pass=$(grep -E '^SOAP_PASS=' .env 2>/dev/null | cut -d= -f2- || true)
        port=$(grep -E '^DOCKER_SOAP_EXTERNAL_PORT=' .env 2>/dev/null | cut -d= -f2- || true)
        port="${port:-7878}"
        if [ -z "$user" ] || [ -z "$pass" ]; then
          echo "SOAP_USER/SOAP_PASS not set in .env. Run: task soap USER=x PASS=y" >&2
          exit 1
        fi
        body='<?xml version="1.0" encoding="utf-8"?>
        <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ns1="urn:AC">
          <SOAP-ENV:Body><ns1:executeCommand><command>server info</command></ns1:executeCommand></SOAP-ENV:Body>
        </SOAP-ENV:Envelope>'
        # gSOAP returns its 401 in the HTTP status only — the body is a SOAP
        # Fault mentioning neither "401" nor "Unauthorized" — so the status
        # code has to be captured separately or auth failures look like the
        # worldserver being down.
        # `|| true` because a refused connection exits 7, which would abort
        # the task under errexit before the diagnostics below can run. curl
        # still emits the write-out (as 000) in that case.
        raw=$(curl -s -m 10 -u "$user:$pass" -H 'Content-Type: text/xml' \
               -d "$body" -w '__HTTP__%{http_code}' "http://127.0.0.1:${port}/" 2>/dev/null || true)
        code=${raw##*__HTTP__}
        out=${raw%__HTTP__*}
        case "$code" in
          000|"")
            echo "Could not reach the worldserver SOAP API on 127.0.0.1:${port}." >&2
            echo "Is ac-worldserver up? Check with: task ps" >&2
            exit 1
            ;;
          401|403)
            echo "SOAP auth REJECTED for '$user' (HTTP $code)." >&2
            echo "Check the password, and that the account has GM level 3:" >&2
            echo "  task admin USER=$user PASS=<pw>" >&2
            exit 1
            ;;
        esac
        case "$out" in
          *"<result>"*)
            echo "SOAP OK as '$user'. Worldserver replied:"
            # Range-match so the XML declaration outside <result> is dropped.
            printf '%s\n' "$out" \
              | sed -n '/<result>/,/<\/result>/p' \
              | sed -e 's|.*<result>||' -e 's|</result>.*||' -e 's/&#xD;//g' \
              | sed -e '/^[[:space:]]*$/d' -e 's/^/  /' | head -6
            ;;
          *)
            echo "No usable reply from the worldserver SOAP API on port $port (HTTP ${code:-none})." >&2
            echo "Is ac-worldserver running? Check: task logs -- ac-worldserver" >&2
            exit 1
            ;;
        esac

  # ── Shop ─────────────────────────────────────────────────────────────────
  shop:seed:
    desc: Seed/refresh the shop catalog and starter packs (validates item ids)
    cmds:
      - docker compose exec ac-webapp node scripts/seed-shop.mjs

  shop:grant:
    desc: "Grant shop points directly: task shop:grant USER=name AMOUNT=500"
    requires:
      vars: [USER, AMOUNT]
    silent: true
    cmds:
      - |
        docker compose exec -T ac-database mysql -uroot -p{{.DB_PASS}} -e "
          SET @acct = (SELECT id FROM acore_auth.account WHERE username = UPPER('{{.USER}}'));
          SELECT IF(@acct IS NULL, 'No such account', 'ok') AS check_account;
          INSERT INTO summonstack_web.shop_balances (account_id, balance)
            SELECT @acct, {{.AMOUNT}} WHERE @acct IS NOT NULL
            ON DUPLICATE KEY UPDATE balance = balance + {{.AMOUNT}};
          INSERT INTO summonstack_web.shop_ledger (account_id, delta, reason, note)
            SELECT @acct, {{.AMOUNT}}, 'admin_grant', 'task shop:grant' WHERE @acct IS NOT NULL;
          SELECT balance FROM summonstack_web.shop_balances WHERE account_id = @acct;
        " 2>/dev/null

  # ── Database ─────────────────────────────────────────────────────────────
  db:
    desc: "MySQL shell, e.g. task db -- acore_world (default: acore_auth)"
    cmds:
      - docker compose exec ac-database mysql -uroot -p{{.DB_PASS}} {{.CLI_ARGS | default "acore_auth"}}

  db:import:
    desc: Re-run the schema importer and report failures loudly
    cmds:
      - docker compose up -d --force-recreate --no-deps ac-db-import
      - |
        echo "Waiting for the import to finish…"
        code=$(docker wait ac-db-import)
        if [ "$code" != "0" ]; then
          echo "" >&2
          echo "Import FAILED (exit $code). Last 40 log lines:" >&2
          docker logs --tail 40 ac-db-import >&2
          exit 1
        fi
        echo "Import complete."

  world:
    desc: Attach to the worldserver console (detach with Ctrl-P Ctrl-Q)
    cmds:
      - docker attach ac-worldserver

  # ── Downloads ────────────────────────────────────────────────────────────
  client:check:
    desc: Verify the download server without transferring gigabytes
    silent: true
    cmds:
      - |
        # Mirrors the compose default: an explicit DOWNLOAD_URL wins, else
        # PUBLIC_HOST on the published download port.
        base="$(grep -E '^DOWNLOAD_URL=' .env 2>/dev/null | cut -d= -f2- || true)"
        if [ -z "$base" ]; then
          host="$(grep -E '^PUBLIC_HOST=' .env 2>/dev/null | cut -d= -f2- || true)"
          port="$(grep -E '^DOCKER_DOWNLOAD_EXTERNAL_PORT=' .env 2>/dev/null | cut -d= -f2- || true)"
          base="http://${host:-localhost}:${port:-8081}"
        fi
        echo "Download server: $base"
        printf '  healthz             -> %s (expect 200)\n' \
          "$(curl -s -o /dev/null -w '%{http_code}' "$base/healthz")"
        # Anonymous, so this only ever sees the redirect — never the file.
        printf '  client.zip (anon)   -> %s (expect 302, login required)\n' \
          "$(curl -s -o /dev/null -w '%{http_code}' "$base/files/client.zip")"
        printf '  test fixture (anon) -> %s (expect 302)\n' \
          "$(curl -s -o /dev/null -w '%{http_code}' "$base/files/test.txt")"
        # Read the size off the mount instead of over HTTP: an authenticated
        # GET would stream the whole ~18 GB file just to read one header.
        size=$(docker compose exec -T ac-downloads stat -c %s /srv/client.zip 2>/dev/null | tr -d '\r')
        if [ -n "$size" ] && [ "$size" -gt 0 ] 2>/dev/null; then
          printf '  client.zip mounted  -> %s bytes (%s GB)\n' \
            "$size" "$(awk -v b="$size" 'BEGIN{printf "%.1f", b/1000000000}')"
        else
          echo "  client.zip mounted  -> MISSING (check CLIENT_ZIP_PATH in .env)"
        fi

  # ── Diagnostics ──────────────────────────────────────────────────────────
  doctor:
    desc: Check for stale images, missing .env, and container name clashes
    silent: true
    cmds:
      - |
        echo "── .env ──"
        if [ -f .env ]; then
          echo "  present"
          if grep -q '^SESSION_SECRET=please-change-me' .env 2>/dev/null; then
            echo "  WARNING: SESSION_SECRET is still the default — sessions are forgeable."
          fi
        else
          echo "  MISSING — the stack is running on compose defaults, including"
          echo "  the published default SESSION_SECRET. Run: task setup"
        fi

        echo "── image ages ──"
        for img in acore/ac-wotlk-db-import:master \
                   acore/ac-wotlk-worldserver:master \
                   acore/ac-wotlk-authserver:master \
                   acore/ac-wotlk-client-data:master; do
          created=$(docker inspect "$img" --format '{{"{{"}}.Created{{"}}"}}' 2>/dev/null | cut -dT -f1)
          printf '  %-40s %s\n' "$img" "${created:-not pulled}"
        done
        echo "  Mismatched dates cause schema errors (e.g. a worldserver that"
        echo "  expects rbac_* tables an older importer never created)."
        echo "  Fix with: task pull && task db:import"

        echo "── container name clashes ──"
        clash=$(docker ps -a --filter "name=^/ac-" \
          --format '{{"{{"}}.Names{{"}}"}} {{"{{"}}.Label "com.docker.compose.project"{{"}}"}}' \
          | awk '$2 != "summonstack" && $2 != "" {print "  " $1 " belongs to project: " $2}')
        if [ -n "$clash" ]; then
          echo "$clash"
          echo "  container_name is global, so these block this stack from starting."
        else
          echo "  none"
        fi

  setup:
    desc: Create .env with a random session secret (safe to re-run)
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      # The DB password must match what MySQL was initialised with; an env var
      # cannot change an existing datadir's root password.
      - |
        existing_pw="password"
        sed -i "s|^DOCKER_DB_ROOT_PASSWORD=.*|DOCKER_DB_ROOT_PASSWORD=${existing_pw}|" .env
        secret=$(openssl rand -base64 48 | tr -d '\n')
        sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=${secret}|" .env
        echo "Wrote .env with a random SESSION_SECRET."
        echo "DOCKER_DB_ROOT_PASSWORD left as '${existing_pw}' to match the existing"
        echo "MySQL volume — changing it needs an ALTER USER, not just this file."

  # ── Reset ────────────────────────────────────────────────────────────────
  reset:
    desc: "Rebuild all game databases from scratch (keeps the 3 GB client data)"
    prompt: Drop acore_auth, acore_world and acore_characters and re-import them? All accounts and characters are lost.
    cmds:
      - docker compose stop ac-worldserver ac-authserver ac-webapp
      - |
        for db in {{.ACORE_DBS}}; do
          echo "Dropping $db…"
          docker compose exec -T ac-database \
            mysql -uroot -p{{.DB_PASS}} -e "DROP DATABASE IF EXISTS \`$db\`;"
        done
      - task: db:import
      - docker compose up -d
      - |
        echo ""
        echo "Databases rebuilt. Recreate your admin account with:"
        echo "  task admin USER=myadmin PASS=MySecretPass1"

  reset:hard:
    desc: "Delete EVERYTHING including the DB and the 3 GB client data"
    prompt: Remove all containers AND volumes? The client data must then be re-downloaded (~3 GB).
    cmds:
      - docker compose down -v --remove-orphans
      - |
        echo ""
        echo "All volumes removed. Next: task up"
        echo "First boot re-downloads client data and re-initialises MySQL,"
        echo "which takes roughly 10-15 minutes before the portal responds."
