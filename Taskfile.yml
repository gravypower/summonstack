# SummonStack task runner — https://taskfile.dev
#
#   task              list every task
#   task up           start the stack
#   task doctor       check for the problems that actually bite this stack
#
# Install Task: https://taskfile.dev/installation/
version: "3"

vars:
  # Falls back to the compose default, which is what MySQL was initialised
  # with when no .env existed.
  DB_PASS:
    sh: |
      pw=$(grep -E '^DOCKER_DB_ROOT_PASSWORD=' .env 2>/dev/null | cut -d= -f2- || true)
      echo "${pw:-password}"
  ACORE_DBS: acore_auth acore_world acore_characters

includes:
  admin:
    taskfile: ./tasks/admin.yml
    dir: .
  db:
    taskfile: ./tasks/db.yml
    dir: .
  shop:
    taskfile: ./tasks/shop.yml
    dir: .
  client:
    taskfile: ./tasks/client.yml
    dir: .
  zerotier:
    taskfile: ./tasks/zerotier.yml
    dir: .
  cloudflare:
    taskfile: ./tasks/cloudflare.yml
    dir: .
  realm:
    taskfile: ./tasks/realm.yml
    dir: .

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ── Core Lifecycle ────────────────────────────────────────────────────────
  up:
    desc: Start the whole stack (playerbots realm too when PLAYERBOTS_MODE=1)
    cmds:
      - |
        profiles=""
        zt_id=$(grep -E '^ZEROTIER_NETWORK_ID=' .env 2>/dev/null | cut -d= -f2- || true)
        cf_token=$(grep -E '^CLOUDFLARE_TUNNEL_TOKEN=' .env 2>/dev/null | cut -d= -f2- || true)
        pb_mode=$(grep -E '^PLAYERBOTS_MODE=' .env 2>/dev/null | cut -d= -f2- || true)
        if [ -n "$zt_id" ]; then
          profiles="$profiles --profile zerotier"
        fi
        if [ -n "$cf_token" ]; then
          profiles="$profiles --profile cloudflare"
        fi
        if [ -n "$pb_mode" ] && [ "$pb_mode" != "0" ]; then
          profiles="$profiles --profile playerbots"
        fi
        docker compose $profiles up -d
      - task: ps

  down:
    desc: Stop the stack (keeps all data)
    cmds:
      - docker compose down

  restart:
    desc: "Restart services, e.g. task restart -- ac-webapp"
    cmds:
      - docker compose restart {{.CLI_ARGS}}

  ps:
    desc: Show container status
    cmds:
      - docker compose ps -a

  logs:
    desc: "Follow logs from all running containers (or specific service, e.g. task logs -- ac-worldserver)"
    cmds:
      - bash -c 'trap "exit 0" INT; docker compose --profile "*" logs -f --tail 100 {{.CLI_ARGS}}'

  pull:
    desc: Refresh all images (guards against stale cached :master tags)
    cmds:
      - docker compose pull

  build:
    desc: Rebuild the webapp image and restart it
    cmds:
      - BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose build ac-webapp
      - docker compose up -d --no-deps ac-webapp

  world:
    desc: Attach to the worldserver console (detach with Ctrl-P Ctrl-Q)
    cmds:
      - task: realm:world
        vars: {REALM: "1"}

  # ── Account & Admin Aliases ──────────────────────────────────────────────
  admin:
    desc: "Create/promote a GM3 admin (wires the console on first setup; SOAP=1 repoints it)"
    requires:
      vars: [USER, PASS]
    cmds:
      - task: admin:default
        vars: {USER: "{{.USER}}", PASS: "{{.PASS}}", SOAP: "{{.SOAP}}"}

  soap:
    desc: "Point the admin console at an account: task soap USER=myadmin PASS=pw"
    requires:
      vars: [USER, PASS]
    cmds:
      - task: admin:soap
        vars: {USER: "{{.USER}}", PASS: "{{.PASS}}"}

  soap:check:
    desc: Verify the admin console credentials against the worldserver
    cmds:
      - task: admin:soap-check

  # ── Diagnostics & Setup ──────────────────────────────────────────────────
  doctor:
    desc: Check for stale images, missing .env, and container name clashes
    silent: true
    cmds:
      - |
        echo "── .env ──"
        if [ -f .env ]; then
          echo "  present"
          if grep -q '^SESSION_SECRET=please-change-me' .env 2>/dev/null; then
            echo "  WARNING: SESSION_SECRET is still the default — sessions are forgeable."
          fi
        else
          echo "  MISSING — the stack is running on compose defaults, including"
          echo "  the published default SESSION_SECRET. Run: task setup"
        fi

        echo "── image ages ──"
        for img in acore/ac-wotlk-db-import:master \
                   acore/ac-wotlk-worldserver:master \
                   acore/ac-wotlk-authserver:master \
                   acore/ac-wotlk-client-data:master; do
          created=$(docker inspect "$img" --format '{{"{{"}}.Created{{"}}"}}' 2>/dev/null | cut -dT -f1)
          printf '  %-40s %s\n' "$img" "${created:-not pulled}"
        done
        echo "  Mismatched dates cause schema errors (e.g. a worldserver that"
        echo "  expects rbac_* tables an older importer never created)."
        echo "  Fix with: task pull && task db:import"

        echo "── container name clashes ──"
        clash=$(docker ps -a --filter "name=^/ac-" \
          --format '{{"{{"}}.Names{{"}}"}} {{"{{"}}.Label "com.docker.compose.project"{{"}}"}}' \
          | awk '$2 != "summonstack" && $2 != "" {print "  " $1 " belongs to project: " $2}')
        if [ -n "$clash" ]; then
          echo "$clash"
          echo "  container_name is global, so these block this stack from starting."
        else
          echo "  none"
        fi

  setup:
    desc: Create .env with a random session secret (safe to re-run)
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - |
        existing_pw="password"
        sed -i "s|^DOCKER_DB_ROOT_PASSWORD=.*|DOCKER_DB_ROOT_PASSWORD=${existing_pw}|" .env
        secret=$(openssl rand -base64 48 | tr -d '\n')
        sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=${secret}|" .env
        echo "Wrote .env with a random SESSION_SECRET."
        echo "DOCKER_DB_ROOT_PASSWORD left as '${existing_pw}' to match the existing"
        echo "MySQL volume — changing it needs an ALTER USER, not just this file."

  # ── Reset ────────────────────────────────────────────────────────────────
  reset:
    desc: "Rebuild all game databases from scratch (keeps the 3 GB client data)"
    prompt: Drop acore_auth, acore_world and acore_characters and re-import them? All accounts and characters are lost.
    cmds:
      - docker compose stop ac-worldserver ac-authserver ac-webapp
      - |
        for db in {{.ACORE_DBS}}; do
          echo "Dropping $db…"
          docker compose exec -T ac-database \
            mysql -uroot -p{{.DB_PASS}} -e "DROP DATABASE IF EXISTS \`$db\`;"
        done
      - task: db:import
      - docker compose up -d
      - |
        echo ""
        echo "Databases rebuilt. Recreate your admin account with:"
        echo "  task admin USER=myadmin PASS=MySecretPass1"

  reset:hard:
    desc: "Delete EVERYTHING including the DB and the 3 GB client data"
    prompt: Remove all containers AND volumes? The client data must then be re-downloaded (~3 GB).
    cmds:
      - docker compose down -v --remove-orphans
      - |
        echo ""
        echo "All volumes removed. Next: task up"
        echo "First boot re-downloads client data and re-initialises MySQL,"
        echo "which takes roughly 10-15 minutes before the portal responds."
