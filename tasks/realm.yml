# Domain: Multi-Realm Management
#
# realms.yml is the source of truth. Every task here looks a realm up in the
# manifest rather than deriving container names from the id, which is what the
# old `case "$id" in 1) ac-worldserver;; 2) ac-pb-worldserver;;` branches did.
version: "3"

vars:
  SS: python3 -m scripts.summonstack

tasks:
  default:
    desc: List all declared realms and their container status
    cmds:
      - task: list
    silent: true

  list:
    desc: Show every realm in realms.yml with its live container status
    silent: true
    cmds:
      - "{{.SS}} list"

  check:
    desc: Report drift between realms.yml, compose, realmlist, containers and databases
    silent: true
    cmds:
      - "{{.SS}} check"

  render:
    desc: Regenerate the files derived from realms.yml (compose override, portal manifest)
    cmds:
      - "{{.SS}} render"

  plan:
    desc: Show what a reconcile would change, without changing anything
    silent: true
    cmds:
      - "{{.SS}} plan"

  apply:
    desc: "Reconcile everything to match realms.yml: task realm:apply [WAIT=900]"
    cmds:
      - "{{.SS}} apply {{if .WAIT}}--wait {{.WAIT}}{{end}}"

  info:
    desc: "Show one realm's resolved settings: task realm:info REALM=1|2|pb|main"
    silent: true
    cmds:
      - '{{.SS}} resolve "{{.REALM | default "1"}}"'

  databases:
    desc: List the databases still referenced by a realm (safe-to-drop check)
    silent: true
    cmds:
      - "{{.SS}} databases"

  add:
    desc: "Add a normal realm: task realm:add [NAME=\"My Realm\"] [ID=3] [PORT=8087] [ADDR=1.2.3.4] [CREATE_DB=1]"
    cmds:
      - task: add-realm
        vars:
          TYPE: normal
          NAME: "{{.NAME}}"
          ID: "{{.ID}}"
          PORT: "{{.PORT}}"
          ADDR: "{{.ADDR}}"
          CREATE_DB: '{{.CREATE_DB | default "1"}}'

  "add:playerbots":
    desc: "Add a playerbots realm: task realm:add:playerbots [NAME=\"PB Realm\"] [ID=3] [PORT=8087] [ADDR=1.2.3.4]"
    cmds:
      - task: add-realm
        vars:
          TYPE: playerbots
          NAME: "{{.NAME}}"
          ID: "{{.ID}}"
          PORT: "{{.PORT}}"
          ADDR: "{{.ADDR}}"
          CREATE_DB: '{{.CREATE_DB | default "1"}}'

  add-realm:
    internal: true
    cmds:
      # Adding a realm is: write it to the manifest, then reconcile. The
      # importer builds its databases, realmlist is upserted and the container
      # is started by the same code path `task realm:apply` runs, so a failure
      # part way through is repaired by re-running rather than hand-unpicked.
      - |
        set -euo pipefail
        {{.SS}} add \
          --type "{{.TYPE}}" \
          --name "{{.NAME}}" \
          {{if .ID}}--id "{{.ID}}"{{end}} \
          {{if .PORT}}--port "{{.PORT}}"{{end}} \
          {{if .ADDR}}--addr "{{.ADDR}}"{{end}} \
          {{if eq .CREATE_DB "0"}}--share-dbs{{end}}
        echo ""
        {{.SS}} list

  remove:
    desc: "Remove a realm: task realm:remove ID=3 [DROP_DB=1] [FORCE=1]"
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.ID}}" ]; then
          echo "Usage: task realm:remove ID=<realm-id> [DROP_DB=1]" >&2
          exit 1
        fi

        # Resolved before the manifest entry goes away, because the database
        # names are needed below and the reconcile deliberately never drops a
        # database on its own.
        eval "$({{.SS}} resolve "{{.ID}}" --print-env)"

        # Dropping the realm from the manifest and reconciling stops and removes
        # its container and deletes its realmlist row. The old version passed
        # both ac-realm-N and ac-pb-realm-N to `docker compose stop`, and
        # compose refuses the whole command when one of them is not a defined
        # service — so nothing was stopped and the container was orphaned.
        # FORCE=1 drops a realm that docker-compose.yml declares by hand from
        # the manifest only. The service stays defined in compose, so use it
        # after deleting the service block there, not instead of.
        {{.SS}} remove --id "{{.ID}}" {{if eq (.FORCE | default "0") "1"}}--force{{end}}

        export MYSQL_PWD='{{.DB_PASS}}'
        if [ "{{.DROP_DB | default "0"}}" = "1" ]; then
          # Only databases no remaining realm references. A realm added with
          # CREATE_DB=0 shares acore_characters with realm 1, so dropping "its"
          # character database by name would take the main one with it.
          still_used=$({{.SS}} databases)
          for db in "$REALM_CHARS_DB" "$REALM_WORLD_DB"; do
            if printf '%s\n' "$still_used" | grep -qxF "$db"; then
              echo "Keeping $db — still used by another realm."
            else
              echo "Dropping $db..."
              docker exec -e MYSQL_PWD ac-database mysql -uroot \
                -e "DROP DATABASE IF EXISTS \`$db\`;"
            fi
          done
        fi

        echo "Realm {{.ID}} removed."
        echo ""
        {{.SS}} list

  up:
    desc: "Start realm service(s): task realm:up [REALM=1|2|pb|main]"
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.REALM}}" ]; then
          task up
          exit 0
        fi
        eval "$({{.SS}} resolve "{{.REALM}}" --print-env)"
        docker compose ${REALM_PROFILE:+--profile "$REALM_PROFILE"} up -d "$REALM_SERVICE"
      - task: status
        vars: {REALM: "{{.REALM}}"}

  down:
    desc: "Stop realm service(s): task realm:down [REALM=1|2|pb|main]"
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.REALM}}" ]; then
          docker compose stop
          exit 0
        fi
        eval "$({{.SS}} resolve "{{.REALM}}" --print-env)"
        docker compose ${REALM_PROFILE:+--profile "$REALM_PROFILE"} stop "$REALM_SERVICE"

  restart:
    desc: "Restart realm service(s): task realm:restart [REALM=1|2|pb|main]"
    cmds:
      - |
        set -euo pipefail
        eval "$({{.SS}} resolve "{{.REALM}}" --print-env)"
        docker compose ${REALM_PROFILE:+--profile "$REALM_PROFILE"} restart "$REALM_SERVICE"

  status:
    desc: "Show realm container status: task realm:status [REALM=1|2|pb|main]"
    silent: true
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.REALM}}" ]; then
          docker compose --profile "*" ps -a
          exit 0
        fi
        eval "$({{.SS}} resolve "{{.REALM}}" --print-env)"
        docker compose ${REALM_PROFILE:+--profile "$REALM_PROFILE"} ps -a "$REALM_SERVICE"

  logs:
    desc: "Follow realm logs: task realm:logs [REALM=1|2|pb|main]"
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.REALM}}" ]; then
          exec bash -c 'trap "exit 0" INT; docker compose --profile "*" logs -f --tail 100'
        fi
        eval "$({{.SS}} resolve "{{.REALM}}" --print-env)"
        exec bash -c 'trap "exit 0" INT; docker compose --profile "*" logs -f --tail 100 "$1"' _ "$REALM_SERVICE"

  world:
    desc: "Attach to a realm console: task realm:world [REALM=1|2|pb|main]"
    cmds:
      - |
        set -euo pipefail
        eval "$({{.SS}} resolve "{{.REALM}}" --print-env)"
        echo "Attaching to $REALM_SERVICE console (detach with Ctrl-P Ctrl-Q)..."
        docker attach "$REALM_SERVICE"

  db:import:
    desc: "Re-import a realm's databases: task realm:db:import REALM=1|2|pb"
    cmds:
      # One importer run per realm, driven by the manifest — the same code path
      # `task realm:apply` uses for a database that is missing. There is no
      # longer a separate playerbots branch: a realm's databases are whatever
      # realms.yml says they are.
      - '{{.SS}} provision "{{.REALM | default "1"}}"'

  build:
    desc: "Build realm worldserver from source: task realm:build [REALM=pb]"
    cmds:
      - |
        set -euo pipefail
        eval "$({{.SS}} resolve "{{.REALM | default "pb"}}" --print-env)"
        if [ "$REALM_TYPE" != "playerbots" ]; then
          echo "Realm $REALM_ID uses the official prebuilt image; nothing to build."
          echo "For the playerbots source build, run: task realm:build REALM=pb"
          exit 0
        fi
        # playerbots/Dockerfile.ale — the plain playerbots build plus the
        # AzerothCore Lua Engine, so this realm runs worldserver/lua_scripts
        # like every other one. If ALE ever fails to compile against the
        # playerbots fork, point the service's build.dockerfile back at
        # playerbots/Dockerfile to get a working realm without Lua.
        echo "Building playerbots worldserver from source (30-60 min uncached)..."
        BUILDX_NO_DEFAULT_ATTESTATIONS=1 \
          docker compose --profile playerbots build ac-pb-worldserver
        echo "Build complete."

  set-addr:
    desc: "Set realmlist address: task realm:set-addr REALM=1 ADDR=1.2.3.4"
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.ADDR}}" ]; then
          echo ""
          echo "Usage: task realm:set-addr REALM=<id> ADDR=<server-ip-or-hostname>"
          echo "Example: task realm:set-addr REALM=1 ADDR=192.168.1.50"
          echo ""
          echo "Declared realms:"
          {{.SS}} list
          exit 1
        fi
        eval "$({{.SS}} resolve "{{.REALM | default "1"}}" --print-env)"
        export MYSQL_PWD='{{.DB_PASS}}'
        docker exec -e MYSQL_PWD ac-database mysql -uroot \
          -e "UPDATE acore_auth.realmlist SET address = '{{.ADDR}}' WHERE id = $REALM_ID;"
        echo "Realm $REALM_ID address set to: {{.ADDR}}"
        echo ""
        echo "realms.yml still says $REALM_ADDR — update it there too, or"
        echo "task realm:check will keep reporting the difference."

  soap:check:
    desc: "Check SOAP connection for a realm: task realm:soap:check [REALM=1|2]"
    cmds:
      - |
        set -euo pipefail
        eval "$({{.SS}} resolve "{{.REALM | default "1"}}" --print-env)"
        task admin:soap-check PORT="$REALM_SOAP_PORT"
