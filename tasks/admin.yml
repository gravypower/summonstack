# Domain: Admin & SOAP Console Management
version: "3"

vars:
  SS: python3 -m scripts.summonstack

tasks:
  default:
    desc: "Create/promote a GM3 admin (wires the console on first setup; SOAP=1 repoints it)"
    requires:
      vars: [USER, PASS]
    silent: true
    cmds:
      - docker compose exec ac-webapp node scripts/create-admin.mjs {{.USER}} {{.PASS}}
      - |
        cur_user=$(grep -E '^SOAP_USER=' .env 2>/dev/null | cut -d= -f2- || true)
        cur_pass=$(grep -E '^SOAP_PASS=' .env 2>/dev/null | cut -d= -f2- || true)
        if [ ! -f .env ]; then
          echo ""
          echo "No .env yet, so the admin console was not wired. Run:"
          echo "  task setup && task soap USER={{.USER}} PASS=<the password>"
        elif [ -n "{{.SOAP}}" ] || [ -z "$cur_pass" ]; then
          echo ""
          task soap USER='{{.USER}}' PASS='{{.PASS}}'
        else
          echo ""
          echo "Admin console is already wired to '${cur_user}' — left alone."
          echo "To repoint it at {{.USER}}, re-run with SOAP=1."
        fi

  soap:
    desc: "Point the admin console at an account: task soap USER=myadmin PASS=pw"
    requires:
      vars: [USER, PASS]
    silent: true
    cmds:
      - "{{.SS}} soap-set --user '{{.USER}}' --pass '{{.PASS}}'"
      - docker compose up -d --no-deps ac-webapp
      - task: "soap:check"

  "soap:check":
    desc: Verify the admin console credentials against the worldserver (or specific realm SOAP port)
    vars:
      PORT: '{{.PORT | default ""}}'
    silent: true
    cmds:
      - "{{.SS}} soap-check {{if .PORT}}--port {{.PORT}}{{end}}"

