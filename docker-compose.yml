# SummonStack — AzerothCore (WotLK 3.3.5a) + web portal, all in Docker Compose.
#
# Quickstart:
#   1. copy .env.example to .env and edit the secrets
#   2. docker compose up -d
#   3. see README.md for creating the first admin account
#
# Uses the official prebuilt AzerothCore images (no compile step).
#
# Optional: playerbots mode adds a second realm (mod-playerbots/azerothcore-wotlk)
# built from source.  Build once with `task playerbots:build`, then enable with
# PLAYERBOTS_MODE=1 in .env and `task up` (or `task playerbots:up`).

services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    networks:
      - ac-network
    ports:
      # Bound to localhost only — for tools like Keira3/HeidiSQL on the host.
      - 127.0.0.1:${DOCKER_DB_EXTERNAL_PORT:-3306}:3306
    environment:
      - MYSQL_ROOT_PASSWORD=${DOCKER_DB_ROOT_PASSWORD:-password}
    volumes:
      - ac-database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40
      # First boot initialises the data directory, which can take well over ten
      # minutes on a slow disk. Failures during start_period do not count
      # against `retries`, so the stack waits instead of aborting.
      start_period: 15m

  # One-shot: creates/updates acore_auth, acore_world, acore_characters.
  ac-db-import:
    container_name: ac-db-import
    image: acore/ac-wotlk-db-import:${DOCKER_IMAGE_TAG:-master}
    networks:
      - ac-network
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_characters"
    depends_on:
      ac-database:
        condition: service_healthy

  # One-shot: downloads maps/vmaps/mmaps/dbc (~3 GB) into the shared volume.
  ac-client-data-init:
    container_name: ac-client-data-init
    image: acore/ac-wotlk-client-data:${DOCKER_IMAGE_TAG:-master}
    volumes:
      - ac-client-data:/azerothcore/env/dist/data

  ac-authserver:
    container_name: ac-authserver
    image: acore/ac-wotlk-authserver:${DOCKER_IMAGE_TAG:-master}
    networks:
      - ac-network
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
    ports:
      - ${DOCKER_AUTH_EXTERNAL_PORT:-3724}:3724
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-worldserver:
    container_name: ac-worldserver
    image: acore/ac-wotlk-worldserver:${DOCKER_IMAGE_TAG:-master}
    networks:
      - ac-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_characters"
      # SOAP API for the web admin console (reachable only inside ac-network,
      # plus localhost on the host below).
      AC_SOAP_ENABLED: "1"
      AC_SOAP_IP: "0.0.0.0"
      AC_UPDATES_REDUNDANCY: "0"
      AC_UPDATES_ALLOW_REHASH: "1"
      # The Lua engine that runs the XP event script is configured by the
      # mod_ale.conf mounted below, not from here.
    ports:
      - ${DOCKER_WORLD_EXTERNAL_PORT:-8085}:8085
      - 127.0.0.1:${DOCKER_SOAP_EXTERNAL_PORT:-7878}:7878
    volumes:
      - ac-client-data:/azerothcore/env/dist/data/:ro
      # Turns the bundled Lua engine on and gives it somewhere to log.
      #
      # The whole directory is mounted, read-write, rather than mod_ale.conf
      # alone: this path does not exist in the image, so a single-file mount
      # makes Docker create the parent as root, and the entrypoint's
      # `cp -rn env/ref/etc/*` then fails to write mod_ale.conf.dist into it.
      # That cp runs under `set -e`, so the container dies on start. The
      # directory must stay writable by uid 1000 (`task fix-perms`).
      - ./worldserver/modules:/azerothcore/env/dist/etc/modules
      # Lua event scripts. The worldserver's CWD is /azerothcore and ScriptPath
      # is the relative "lua_scripts", so this is the directory it scans. It
      # watches the directory and reloads on change, so editing a script here
      # needs no restart.
      - ./worldserver/lua_scripts:/azerothcore/lua_scripts:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully

  # Player portal + admin site (Next.js).
  ac-webapp:
    container_name: ac-webapp
    build: ./webapp
    networks:
      - ac-network
    restart: unless-stopped
    environment:
      DB_HOST: ac-database
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: ${DOCKER_DB_ROOT_PASSWORD:-password}
      AUTH_DB: acore_auth
      CHARS_DB: acore_characters
      WEB_DB: summonstack_web
      SOAP_URL: http://ac-worldserver:7878
      SOAP_USER: ${SOAP_USER:-admin}
      SOAP_PASS: ${SOAP_PASS:-}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me}
      # Both default to PUBLIC_HOST on their published ports, so the usual
      # case (plain HTTP, no reverse proxy) needs one hostname in .env rather
      # than two URLs kept in sync. Set either explicitly to override — needed
      # behind a proxy that terminates HTTPS or drops the port.
      SITE_URL: ${SITE_URL:-http://${PUBLIC_HOST:-localhost}:${DOCKER_WEB_EXTERNAL_PORT:-8080}}
      DOWNLOAD_URL: ${DOWNLOAD_URL:-http://${PUBLIC_HOST:-localhost}:${DOCKER_DOWNLOAD_EXTERNAL_PORT:-8081}}
      AUTH_HOST: ac-authserver
      AUTH_PORT: "3724"
      WORLD_HOST: ac-worldserver
      WORLD_PORT: "8085"
      ZEROTIER_NETWORK_ID: ${ZEROTIER_NETWORK_ID:-}
    volumes:
      # realms.json, exported from realms.yml by `task realm:render`, tells the
      # portal each realm's service name and databases instead of leaving it to
      # guess them from the realm id.
      #
      # The directory is mounted rather than the file: webapp/generated/ is
      # committed (via .gitkeep) so this target always exists, whereas a
      # single-file mount would have Docker create realms.json as an empty
      # directory on any clone that had not rendered yet.
      - ./webapp/generated:/app/generated:ro
    ports:
      - ${DOCKER_WEB_EXTERNAL_PORT:-8080}:3000
    depends_on:
      ac-database:
        condition: service_healthy

  # Serves the game client zip. Kept separate from ac-webapp so an ~18 GB
  # download streams straight off disk via sendfile instead of through Node.
  ac-downloads:
    container_name: ac-downloads
    image: nginx:1.27-alpine
    networks:
      - ac-network
    restart: unless-stopped
    environment:
      # Only used to build the login redirect; same default as ac-webapp.
      SITE_URL: ${SITE_URL:-http://${PUBLIC_HOST:-localhost}:${DOCKER_WEB_EXTERNAL_PORT:-8080}}
      PORTAL_INTERNAL_URL: http://ac-webapp:3000
      # Filename the browser saves the client as; the URL stays /files/client.zip.
      CLIENT_ZIP_NAME: ${CLIENT_ZIP_NAME:-ChromieCraft_3.3.5a.zip}
      # Without this, envsubst would also eat nginx's own $variables.
      NGINX_ENVSUBST_VARS: "SITE_URL PORTAL_INTERNAL_URL CLIENT_ZIP_NAME"
    volumes:
      - ./downloads/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Drop any extra file in downloads/files/ to publish it at /files/<name>.
      - ./downloads/files:/srv/downloads:ro
      # Mounted outside /srv/downloads: a bind mount nested inside a read-only
      # directory mount cannot create its own mountpoint.
      - ${CLIENT_ZIP_PATH:-./ChromieCraft_3.3.5a.zip}:/srv/client.zip:ro
    ports:
      - ${DOCKER_DOWNLOAD_EXTERNAL_PORT:-8081}:80
    depends_on:
      - ac-webapp

  # ZeroTier VPN overlay service (optional).
  # Exposes host ports (auth 3724, world 8085, web 8080, dl 8081) to a ZeroTier network.
  # Automatically spun up by `task up` if ZEROTIER_NETWORK_ID is configured in .env.
  ac-zerotier:
    container_name: ac-zerotier
    image: zerotier/zerotier:1.14.0
    profiles:
      - zerotier
      - tunnels
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: on-failure
    volumes:
      - ac-zerotier-data:/var/lib/zerotier-one
    environment:
      ZEROTIER_NETWORK_ID: ${ZEROTIER_NETWORK_ID:-}
    entrypoint: ["sh", "-c", "if [ -z \"$$ZEROTIER_NETWORK_ID\" ]; then echo 'ZEROTIER_NETWORK_ID is not configured in .env. Skipping ZeroTier.'; exit 0; fi; (sleep 3 && zerotier-cli join $$ZEROTIER_NETWORK_ID) & exec zerotier-one"]


  # Cloudflare Tunnel service (optional).
  # Proxies HTTP/HTTPS web portal and downloads through Cloudflare's edge network.
  # Automatically spun up by `task up` if CLOUDFLARE_TUNNEL_TOKEN is configured in .env.
  ac-cloudflared:
    container_name: ac-cloudflared
    image: cloudflare/cloudflared:2024.6.1
    profiles:
      - cloudflare
      - tunnels
    networks:
      - ac-network
    restart: on-failure
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    entrypoint: ["sh", "-c", "if [ -z \"$$TUNNEL_TOKEN\" ]; then echo 'CLOUDFLARE_TUNNEL_TOKEN is not configured in .env. Skipping Cloudflare Tunnel.'; exit 0; fi; exec cloudflared tunnel --no-autoupdate run"]


  # ── Playerbots mode (optional) ─────────────────────────────────────────────
  # A second AzerothCore realm built from source with mod-playerbots enabled.
  # Shares ac-database (MySQL) and ac-authserver with the standard stack.
  # Players see two realms in the WoW client and choose between them.
  #
  # One-time setup:
  #   task playerbots:build    <- compile from source (30-60 min, cached after)
  #   PLAYERBOTS_MODE=1        <- set in .env, then: task up  (or task playerbots:up)

  # One-shot: populates acore_world_pb and acore_characters_pb independently using standard db-import.
  ac-pb-db-import:
    container_name: ac-pb-db-import
    image: acore/ac-wotlk-db-import:${DOCKER_IMAGE_TAG:-master}
    profiles:
      - playerbots
    networks:
      - ac-network
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_world_pb"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_characters_pb"
      AC_UPDATES_AUTO_SETUP: "1"
    depends_on:
      ac-database:
        condition: service_healthy

  # Playerbots worldserver - realm 2, ports 8086 (game) / 7879 (SOAP).
  ac-pb-worldserver:
    container_name: ac-pb-worldserver
    build:
      context: ./playerbots
      # Dockerfile.ale adds the AzerothCore Lua Engine on top of the plain
      # playerbots build, so this realm runs the same worldserver/lua_scripts as
      # every other realm. ./Dockerfile still builds without it if that fails.
      dockerfile: Dockerfile.ale
      target: worldserver
    profiles:
      - playerbots
    networks:
      - ac-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_world_pb"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_characters_pb"
      # Realm 2 - registers alongside the standard worldserver (realm 1) in
      # acore_auth.realmlist so both appear in the WoW client realm list.
      AC_REALM_ID: "2"
      AC_SOAP_ENABLED: "1"
      AC_SOAP_IP: "0.0.0.0"
      # Playerbots module settings — passed as env vars (AC_ prefix + uppercased).
      # See: playerbots/playerbots.conf for the full list of options.
      # These env vars override the mounted conf file values.
      AC_AI_PLAYERBOT_ENABLED: "1"
      AC_AI_PLAYERBOT_ALLOW_PLAYER_BOTS: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "0"
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "10"
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "200"
    ports:
      - ${DOCKER_PB_WORLD_EXTERNAL_PORT:-8086}:8085
      - 127.0.0.1:${DOCKER_PB_SOAP_EXTERNAL_PORT:-7879}:7878
    volumes:
      # Reuse the same extracted client data (maps/vmaps/mmaps/dbc) - no
      # second extraction needed since both realms use identical client files.
      - ac-client-data:/azerothcore/env/dist/data:ro
      # Playerbots module config - edit ./playerbots/playerbots.conf on the
      # host and restart the container to apply changes. This image's entrypoint
      # copies it into etc/modules/ where the core actually reads module config.
      - ./playerbots/playerbots.conf:/azerothcore/env/dist/etc/mod_playerbots.conf:ro
      # The same Lua engine config and scripts every other realm gets.
      #
      # /usr/local/etc/modules, not env/dist/etc/modules as on ac-worldserver:
      # this image is built from the playerbots fork with the default install
      # prefix, so the core looks for module config under /usr/local/etc. Put it
      # anywhere else and the server logs "Not found modules config files" and
      # runs with ALE disabled. The entrypoint copies playerbots.conf here too.
      #
      # Read-write, and the directory rather than the file, for the same reasons
      # as ac-worldserver above.
      - ./worldserver/modules:/usr/local/etc/modules
      # ALE.ScriptPath is relative to the working directory, which is
      # /azerothcore in this image as in the official one.
      - ./worldserver/lua_scripts:/azerothcore/lua_scripts:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-pb-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully

volumes:
  ac-database:
  ac-client-data:
  ac-zerotier-data:

networks:
  ac-network:

