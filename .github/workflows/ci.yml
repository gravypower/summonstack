name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    name: webapp (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      # Matches the node the Dockerfile builds and runs the portal on.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Also covers the worldserver Lua scripts: they are parsed and their
      # hooks are exercised under a Lua VM, since a syntax error there is
      # otherwise only found when a realm starts.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a malformed compose file, and proves the stack still refuses to
      # start without SESSION_SECRET.
      - name: Rejects a missing SESSION_SECRET
        run: |
          if docker compose config -q 2>/dev/null; then
            echo "compose accepted a missing SESSION_SECRET" >&2
            exit 1
          fi
          echo "ok: compose refuses to start without SESSION_SECRET"

      - name: Validates with one set
        run: docker compose config -q
        env:
          SESSION_SECRET: a-secret-long-enough-for-ci

      # WEBAPP_MODE picks between these two. Both have to render, and each has
      # to render as the mode it claims — a silent fallback to the other is
      # exactly the failure this is here to catch.
      - name: Each portal mode renders as itself
        run: |
          target_for() {
            COMPOSE_FILE="$1" docker compose config --format json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["ac-webapp"]["build"]["target"])'
          }
          prod=$(target_for "docker-compose.yml")
          dev=$(target_for "docker-compose.yml:docker-compose.dev.yml")
          echo "prod target: $prod / dev target: $dev"
          # Unset WEBAPP_MODE must mean production: `next dev` recompiles per
          # request and serves stack traces from its error overlay.
          [ "$prod" = "runner" ] || { echo "default should be the runner stage" >&2; exit 1; }
          [ "$dev" = "dev" ] || { echo "dev overlay should select the dev stage" >&2; exit 1; }
        env:
          SESSION_SECRET: a-secret-long-enough-for-ci

      # The generated realm override stops being auto-loaded once COMPOSE_FILE
      # is set, so the Taskfile lists it explicitly. If that ever regressed,
      # every realm would vanish from the stack.
      - name: Setting COMPOSE_FILE does not drop the realm override
        run: |
          printf 'services:\n  ac-realm-1:\n    image: alpine\n' > docker-compose.override.yml
          for files in \
            "docker-compose.yml:docker-compose.override.yml" \
            "docker-compose.yml:docker-compose.override.yml:docker-compose.dev.yml"; do
            COMPOSE_FILE="$files" docker compose config --services | grep -qx ac-realm-1 \
              || { echo "realm service missing with COMPOSE_FILE=$files" >&2; exit 1; }
          done
          rm -f docker-compose.override.yml
          echo "ok: realm override survives in both modes"
        env:
          SESSION_SECRET: a-secret-long-enough-for-ci

  python:
    name: scripts (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the task scripts
        run: python -m compileall -q scripts/
