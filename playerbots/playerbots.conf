# mod_playerbots.conf — SummonStack Playerbots Configuration
#
# Full reference: https://github.com/mod-playerbots/mod-playerbots/wiki/Playerbot-Configuration
#
# This file is mounted into ac-pb-worldserver read-only.
# Edit ./playerbots/playerbots.conf on the host, then restart the worldserver:
#   task restart -- ac-pb-worldserver
#
# Or reload the module in-game (GM level 3):
#   .reload config

[worldserver]

# ─── Core toggle ──────────────────────────────────────────────────────────────
AiPlayerbot.enabled = 1

# ─── Random bots — auto-populate the world ────────────────────────────────────
# Set to 1 to have bots login and roam automatically.
AiPlayerbot.RandomBotAutologin = 0

# How many random bots the system keeps alive at once.
AiPlayerbot.minRandomBots = 10
AiPlayerbot.maxRandomBots = 200

# Level range for randomly-generated bots.
AiPlayerbot.RandomBotMinLevel = 1
AiPlayerbot.RandomBotMaxLevel = 80

# How long (seconds) before a random bot logs out and a new one logs in.
AiPlayerbot.RandomBotUpdateInterval = 60

# ─── Player-controlled bots ───────────────────────────────────────────────────
# Let non-GM players summon and control bots.
AiPlayerbot.AllowPlayerBots = 1

# Maximum bots a player can summon at once (0 = unlimited).
AiPlayerbot.maxAddedBots = 3

# Allow players to add bots from their own account (same account bots).
AiPlayerbot.AllowSameAccountBot = 1

# ─── Bot behaviour ────────────────────────────────────────────────────────────
# Bots pick up loot automatically (requires the worldserver to be built with
# the mod-aoe-loot module for full group loot; works standalone too).
AiPlayerbot.AutoDoQuests = 0
AiPlayerbot.SyncQuestWithPlayer = 1

# ─── Self-bot level (what a player can command without GM rank) ───────────────
# 0 = off, 1 = player, 2 = player + some extras, 3 = GM features
AiPlayerbot.selfBotLevel = 2
