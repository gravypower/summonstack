###############################################################################
# ALE (the Lua engine bundled with the worldserver image), configured for the
# XP event script in worldserver/lua_scripts.
#
# The image ships only mod_ale.conf.dist, so with neither this file nor
# AC_ALE_* environment overrides the engine stays disabled and no script runs.
# docker-compose.yml bind mounts this whole directory over the image's module
# config dir; keeping the settings here rather than in the environment keeps
# them in one place and stops the server logging "Missing property ALE.*" on
# every config load.
#
# Values match the shipped .dist except where noted. If a worldserver update
# adds new ALE settings, the server logs "Missing property ALE.<name>" on
# startup and falls back to the default; copy the new line in from the
# mod_ale.conf.dist the worldserver drops next to this file to silence it.
###############################################################################

[worldserver]

ALE.Enabled = true
ALE.TraceBack = false

# Relative to the worldserver's working directory (/azerothcore), which is
# where docker-compose.yml mounts worldserver/lua_scripts.
ALE.ScriptPath = "lua_scripts"

# Changed from the .dist default: watch the script directory and reload on
# change, so editing a script on the host applies without a restart.
ALE.AutoReload = true
ALE.AutoReloadInterval = 1

ALE.PlayerAnnounceReload = false
ALE.RequirePaths = ""
ALE.RequireCPaths = ""
ALE.BytecodeCache = true

# Engine output gets its own logs/ALE.log. Script errors also reach the
# console and Server.log, so a broken script is visible in `task logs`.
Appender.ALELog=2,5,0,ALE.log,w
Appender.ALEConsole=1,4,0,"0 9 0 3 5 0"
Logger.ALE=4,ALELog ALEConsole
